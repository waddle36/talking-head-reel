<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reel frame</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "PF"; src: url("fonts/PlayfairDisplay-VF.ttf") format("truetype"); font-weight: 400 900; font-style: normal; font-display: block; }
@font-face { font-family: "PF"; src: url("fonts/PlayfairDisplay-Italic-VF.ttf") format("truetype"); font-weight: 400 900; font-style: italic; font-display: block; }
:root {
  /* defaults: green accent, linen paper, charcoal ink. edit.json "style" overrides them per reel */
  --accent: #4FAE50; --paper: #E4DFD7; --ink: #272526; --hl: rgba(79, 174, 80, .40);
  --cond: "Avenir Next Condensed", "AvenirNextCondensed-DemiBold", sans-serif;
}
html, body { margin: 0; padding: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; will-change: transform, filter; }
.layer { position: absolute; inset: 0; pointer-events: none; }
#vignette { background: radial-gradient(ellipse 78% 62% at 50% 40%, rgba(0,0,0,0) 58%, rgba(0,0,0,.34) 100%); }
#scrimB { background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,.16) 60%, rgba(0,0,0,.46) 76%, rgba(0,0,0,.56) 100%); }
#scrimT { background: linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 12%, rgba(0,0,0,0) 22%); }

/* captions */
#cap { position: absolute; left: 90px; width: 840px; bottom: 520px; text-align: center; color: #fff;
  font-family: "PF"; font-weight: 700; font-size: 70px; line-height: 1.08; letter-spacing: -0.005em;
  text-shadow: 0 2px 3px rgba(0,0,0,.35), 0 6px 26px rgba(0,0,0,.55); }
#cap.big { font-size: 86px; bottom: 500px; }
#cap.hook { font-size: 68px; bottom: 470px; }
#cap .line { display: block; white-space: nowrap; }
#cap .line.s { font-size: .82em; }
#cap .line.l { font-size: 1.55em; line-height: .98; }
#cap .line.xl { font-size: 2.1em; line-height: .98; }
#cap .w { display: inline-block; transform-origin: 50% 70%; }
/* green keyword over his green shirt: a dark outline painted under the fill keeps the exact brand green readable */
#cap .k { font-style: italic; font-weight: 800; color: var(--accent);
  -webkit-text-stroke: .085em rgba(18,18,18,.78); paint-order: stroke fill;
  text-shadow: 0 0 3px rgba(0,0,0,.7), 0 2px 2px rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.55), 0 8px 28px rgba(0,0,0,.55); }

/* tracker */
#tracker { position: absolute; left: 0; right: 0; top: 246px; text-align: center; color: #fff; }
#tracker .box { display: inline-block; padding: 16px 34px 18px; border-radius: 16px; background: rgba(12,12,12,.40);
  -webkit-backdrop-filter: blur(14px) saturate(.9); backdrop-filter: blur(14px) saturate(.9); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#tracker .lab { font-family: var(--cond); font-weight: 700; font-size: 34px; letter-spacing: .2em; text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,.55); }
#tracker .lab em { font-style: normal; color: var(--accent); }
#tracker .rule { width: 64px; height: 3px; background: var(--accent); margin: 10px auto 8px; }
#tracker .tit { font-family: "PF"; font-style: italic; font-weight: 600; font-size: 54px; line-height: 1.05;
  text-shadow: 0 2px 4px rgba(0,0,0,.35), 0 6px 22px rgba(0,0,0,.55); }

/* chapter card */
#chapter { position: absolute; left: 90px; right: 90px; top: 520px; text-align: center; color: #fff; }
#chapter .kick { font-family: var(--cond); font-weight: 700; font-size: 42px; letter-spacing: .26em; text-transform: uppercase; }
#chapter .num { font-family: "PF"; font-style: italic; font-weight: 900; font-size: 400px; line-height: .9; color: var(--accent);
  font-variant-numeric: lining-nums;
  margin: 6px 0 4px; text-shadow: 0 10px 50px rgba(0,0,0,.45); }
#chapter .tit { font-family: "PF"; font-weight: 700; font-size: 86px; line-height: 1.04; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
#chapter .tit span { display: block; }

/* study card */
.card { position: absolute; left: 72px; width: 872px; box-sizing: border-box; padding: 52px 56px 44px;
  background: var(--paper); color: var(--ink); border-radius: 18px;
  box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35); transform-origin: 50% 60%; }
.card .kick { font-family: var(--cond); font-weight: 600; font-size: 30px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); }
.card .stat { font-family: "PF"; font-weight: 900; font-size: 168px; line-height: 1; margin: 18px 0 6px; letter-spacing: -0.01em;
  font-variant-numeric: lining-nums; }
.card .stat i { font-weight: 700; font-size: .62em; }
.card .stat small { font-family: var(--cond); font-weight: 700; font-size: 46px; letter-spacing: .06em; }
.card .stat .plus { color: var(--accent); }
.card .body { font-family: "PF"; font-weight: 600; font-size: 56px; line-height: 1.15; margin-top: 16px; text-wrap: pretty; }
.card .body b { font-weight: 800; }
.card .note { font-family: var(--cond); font-weight: 600; font-size: 36px; line-height: 1.25; text-wrap: pretty; margin-top: 26px; padding-top: 22px; border-top: 2px solid rgba(39,37,38,.2); }
.card .src { font-family: var(--cond); font-weight: 500; font-size: 24px; letter-spacing: .03em; color: rgba(39,37,38,.62); margin-top: 30px; }
.card mark { color: inherit; padding: 0 .06em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  background-image: linear-gradient(transparent 10%, var(--hl) 10%, var(--hl) 90%, transparent 90%);
  background-repeat: no-repeat; background-size: 0% 100%; background-color: transparent; }

/* lifestyle list */
#list { position: absolute; left: 110px; top: 1018px; color: #fff; }
#list .lab { font-family: var(--cond); font-weight: 700; font-size: 32px; letter-spacing: .22em; text-transform: uppercase; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.6); margin-bottom: 12px; }
#list .it { font-family: "PF"; font-weight: 700; font-size: 76px; line-height: 1.16; white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0,0,0,.35), 0 6px 26px rgba(0,0,0,.55); }
#list .it i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); margin-right: 26px; vertical-align: 18px; }

/* rabbit-hole tags */
.tag { position: absolute; padding: 16px 28px 18px; background: var(--paper); color: var(--ink); border-radius: 14px;
  font-family: "PF"; font-style: italic; font-weight: 700; font-size: 46px; line-height: 1; white-space: nowrap;
  box-shadow: 0 18px 40px rgba(0,0,0,.42), 0 4px 10px rgba(0,0,0,.3); transform-origin: 50% 50%; }

/* end prompt */
#endp { position: absolute; left: 0; right: 0; top: 236px; text-align: center; }
#endp .q { display: inline-block; padding: 18px 30px 20px; background: var(--paper); color: var(--ink); border-radius: 14px;
  font-family: "PF"; font-style: italic; font-weight: 700; font-size: 46px; line-height: 1.05;
  box-shadow: 0 18px 40px rgba(0,0,0,.42); }
#endp .cta { display: inline-block; margin-top: 16px; padding: 14px 28px 12px; background: var(--accent); color: #fff; border-radius: 12px;
  font-family: var(--cond); font-weight: 700; font-size: 38px; letter-spacing: .14em; text-transform: uppercase;
  box-shadow: 0 14px 30px rgba(0,0,0,.4); }
.hide { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <img id="base" alt="">
  <div id="vignette" class="layer"></div>
  <div id="scrimT" class="layer"></div>
  <div id="scrimB" class="layer"></div>
  <div id="tracker" class="hide"><div class="box"><div class="lab"></div><div class="rule"></div><div class="tit"></div></div></div>
  <div id="cap"></div>
  <div id="list" class="hide"></div>
  <div id="tags" class="layer"></div>
  <div id="chapter" class="hide"><div class="kick"></div><div class="num"></div><div class="tit"></div></div>
  <div id="cards" class="layer"></div>
  <div id="endp" class="hide"><div class="q"></div><br><div class="cta"></div></div>
</div>
<script src="reel.js"></script>
</body>
</html>
