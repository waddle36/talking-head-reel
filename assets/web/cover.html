<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reel cover</title>
<link rel="icon" href="data:,">
<style>
/* The reel cover, built for the profile grid: the grid shows a 3:4 centre crop (y 240 to 1680 of 1920) at about a
   third of the phone's width, and the feed a 4:5 crop (y 285 to 1635). Face and title both sit inside both crops. */
@font-face { font-family: "PF"; src: url("fonts/PlayfairDisplay-VF.ttf") format("truetype"); font-weight: 400 900; font-style: normal; font-display: block; }
@font-face { font-family: "PF"; src: url("fonts/PlayfairDisplay-Italic-VF.ttf") format("truetype"); font-weight: 400 900; font-style: italic; font-display: block; }
:root { --accent: #4FAE50; --ink: #272526; --cond: "Avenir Next Condensed", sans-serif; }
html, body { margin: 0; padding: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #141313;
  font-variant-numeric: lining-nums; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
#shade { position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(20,19,19,.5) 0%, rgba(20,19,19,0) 17%, rgba(20,19,19,0) 42%,
                    rgba(20,19,19,.55) 55%, rgba(20,19,19,.88) 66%, rgba(20,19,19,.95) 100%),
    radial-gradient(ellipse 85% 60% at 50% 32%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%); }
#title { position: absolute; left: 60px; right: 60px; top: 1118px; text-align: center; color: #fff; }
#title .kick { display: inline-block; background: var(--accent); color: #fff; border-radius: 12px;
  font-family: var(--cond); font-weight: 700; font-size: 50px; letter-spacing: .2em; text-transform: uppercase;
  padding: 12px 22px 9px 32px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#title .l1 { font-family: "PF"; font-weight: 800; font-size: 100px; line-height: 1.02; margin-top: 34px;
  white-space: nowrap; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
#title .l2 { font-family: "PF"; font-style: italic; font-weight: 900; font-size: 250px; line-height: .9;
  margin-top: 4px; color: var(--accent); white-space: nowrap;
  -webkit-text-stroke: .03em rgba(18,18,18,.55); paint-order: stroke fill; text-shadow: 0 10px 44px rgba(0,0,0,.55); }
</style>
</head>
<body>
<div id="stage">
  <img id="base" alt="">
  <div id="shade"></div>
  <div id="title">
    <div class="kick"></div>
    <div class="l1"></div>
    <div class="l2"></div>
  </div>
</div>
<script>
'use strict';
// text, colour and framing come from timeline.json "cover" (edit.json "cover" + the face at that frame)
let T = null;
window.READY = (async () => {
  T = await (await fetch('timeline.json?v=' + Date.now())).json();
  const C = T.cover || {}, st = T.style || {};
  if (st.accent) document.documentElement.style.setProperty('--accent', st.accent);
  const q = s => document.querySelector(s);
  q('#title .kick').textContent = C.kicker || '';
  q('#title .kick').style.display = C.kicker ? '' : 'none';
  q('#title .l1').textContent = C.line1 || '';
  q('#title .l2').textContent = C.line2 || '';
  await Promise.all(['800 100px PF', 'italic 900 250px PF'].map(f => document.fonts.load(f)));
  for (const el of document.querySelectorAll('#title .l1, #title .l2')) {   // fit each line to the 960 px column
    const w = el.scrollWidth;
    if (w > 960) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * 956 / w).toFixed(2) + 'px';
  }
  const c = document.createElement('canvas').getContext('2d');
  c.font = '700 40px monospace'; const a = c.measureText('ABC abc 123').width;
  c.font = '700 40px "Avenir Next Condensed", monospace';
  const cond = Math.abs(c.measureText('ABC abc 123').width - a) > 1;
  const ok = document.fonts.check('800 100px PF') && document.fonts.check('italic 900 250px PF') && cond;
  return { frames: 1, fonts: { ok, cond } };
})();
// frame the photo: zoom about the face, the face landing at height face_y
window.renderFrame = async (n, url) => {
  await window.READY;
  const C = T.cover || {};
  const z = C.zoom || 1.3, fx = C.fx ?? 0.5, fy = C.fy ?? 0.36, oy = C.face_y || 0.31;
  const b = document.getElementById('base');
  b.src = url;
  await b.decode();
  const win = 1 / z;
  const left = Math.max(0, Math.min(1 - win, fx - 0.5 * win)), top = Math.max(0, Math.min(1 - win, fy - oy * win));
  b.style.transform = `translate(${(-left * 1080 * z).toFixed(2)}px, ${(-top * 1920 * z).toFixed(2)}px) scale(${z})`;
  return { n, shot: 'cover', z, blur: 0, cap: null };
};
</script>
</body>
</html>
